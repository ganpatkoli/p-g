name: core-tests
on:
  push:
    paths: ['Shared/**', '.github/workflows/core-tests.yml']
  pull_request:
    paths: ['Shared/**']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet test Shared/PoolGame.Core.Tests
